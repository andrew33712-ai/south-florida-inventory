<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehicle Details | Skipster</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-zinc-950 text-white">
  <main class="max-w-4xl mx-auto p-6">
    <h1 id="title" class="text-4xl font-bold mb-4"></h1>
    <p id="price" class="text-3xl text-red-500 font-semibold mb-2"></p>
    <p id="mileage" class="text-xl text-zinc-400 mb-6"></p>
    <img id="image" class="w-full max-w-lg rounded-2xl mb-6" alt="Car image">

    <div id="specs" class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-8 hidden">
      <div class="bg-zinc-900 rounded-xl p-4">
        <p class="text-zinc-500 text-sm mb-1">Horsepower</p>
        <p id="horsepower" class="text-xl font-bold"></p>
      </div>
      <div class="bg-zinc-900 rounded-xl p-4">
        <p class="text-zinc-500 text-sm mb-1">Engine</p>
        <p id="engine" class="text-xl font-bold"></p>
      </div>
      <div class="bg-zinc-900 rounded-xl p-4">
        <p class="text-zinc-500 text-sm mb-1">Transmission</p>
        <p id="transmission" class="text-xl font-bold"></p>
      </div>
      <div class="bg-zinc-900 rounded-xl p-4">
        <p class="text-zinc-500 text-sm mb-1">Drive Type</p>
        <p id="drive_type" class="text-xl font-bold"></p>
      </div>
      <div class="bg-zinc-900 rounded-xl p-4">
        <p class="text-zinc-500 text-sm mb-1">Fuel Type</p>
        <p id="fuel_type" class="text-xl font-bold"></p>
      </div>
      <div class="bg-zinc-900 rounded-xl p-4">
        <p class="text-zinc-500 text-sm mb-1">Body Style</p>
        <p id="body_class" class="text-xl font-bold"></p>
      </div>
    </div>

    <!-- DESCRIPTION SECTION -->
    <div id="description_section" class="mb-8 hidden">
      <div id="description" class="text-zinc-300 text-lg leading-relaxed space-y-4"></div>
    </div>

    <div id="recall_section" class="mb-8 hidden">
      <h2 class="text-2xl font-bold mb-4 text-red-500">Active Recalls</h2>
      <div id="recalls" class="space-y-4"></div>
    </div>

    <button onclick="textDealer()" class="bg-white text-zinc-950 px-8 py-4 rounded-2xl font-semibold flex items-center gap-x-2">
      <i class="fa-solid fa-comment-dots"></i>
      <span>Text About This Vehicle</span>
    </button>
  </main>

  <script>
    async function loadVehicle() {
      var params = new URLSearchParams(window.location.search);
      var vin = params.get('vin');
      if (!vin) {
        document.body.innerHTML = "<h1 class='p-6'>No vehicle selected</h1>";
        return;
      }
      try {
        var res = await fetch('vehicles.json');
        var vehicles = await res.json();
        var vehicle = vehicles.find(function(v) { return v.vin === vin; });
        if (!vehicle) {
          document.body.innerHTML = "<h1 class='p-6'>Vehicle not found</h1>";
          return;
        }

        document.getElementById('title').innerText = vehicle.title;
        document.getElementById('price').innerText = '$' + vehicle.price.toLocaleString();
        document.getElementById('mileage').innerText = vehicle.mileage.toLocaleString() + ' miles';
        document.getElementById('image').src = vehicle.image;

        if (vehicle.description) {
          document.getElementById('description_section').classList.remove('hidden');
          var descDiv = document.getElementById('description');
          var paragraphs = vehicle.description.split('\n\n');
          for (var i = 0; i < paragraphs.length; i++) {
            var para = paragraphs[i].trim();
            if (!para) continue;
            if (para.includes('\n- ') || para.startsWith('- ')) {
              var lines = para.split('\n');
              var ul = document.createElement('ul');
              ul.className = 'list-none space-y-2 my-2';
              for (var j = 0; j < lines.length; j++) {
                var line = lines[j].trim();
                if (line.startsWith('- ')) {
                  var li = document.createElement('li');
                  li.className = 'flex items-start gap-2 text-zinc-300';
                  li.innerHTML = '<span class="text-red-500 mt-1">—</span><span>' + line.substring(2) + '</span>';
                  ul.appendChild(li);
                }
              }
              descDiv.appendChild(ul);
            } else {
              var p = document.createElement('p');
              p.className = 'text-zinc-300 leading-relaxed';
              p.innerText = para;
              descDiv.appendChild(p);
            }
          }
        }

        var cv = vehicle.carVector;
        if (cv) {
          document.getElementById('specs').classList.remove('hidden');
          document.getElementById('horsepower').innerText = cv.horsepower ? cv.horsepower + ' hp' : 'N/A';
          document.getElementById('engine').innerText = (cv.displacement_l && cv.cylinders) ? cv.displacement_l + 'L ' + cv.cylinders + '-cyl' : 'N/A';
          document.getElementById('transmission').innerText = cv.transmission || 'N/A';
          document.getElementById('drive_type').innerText = cv.drive_type || 'N/A';
          document.getElementById('fuel_type').innerText = cv.fuel_type || 'N/A';
          document.getElementById('body_class').innerText = cv.body_class || 'N/A';

          if (cv.recalls && cv.recalls.length > 0) {
            document.getElementById('recall_section').classList.remove('hidden');
            var recallDiv = document.getElementById('recalls');
            for (var i = 0; i < cv.recalls.length; i++) {
              var r = cv.recalls[i];
              var div = document.createElement('div');
              div.className = 'bg-zinc-900 border border-red-800 rounded-xl p-4';
              div.innerHTML = '<p class="font-bold text-red-400 mb-1">' + r.component + '</p><p class="text-zinc-300 text-sm">' + r.summary + '</p><p class="text-zinc-400 text-sm mt-2">' + r.remedy + '</p>';
              recallDiv.appendChild(div);
            }
          }
        }
      } catch(err) {
        console.error('Failed to load vehicle:', err);
      }
    }

    function textDealer() {
      window.location.href = 'sms:8139938391';
    }

    window.onload = loadVehicle;
  </script>
</body>
</html>
