<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skipster • Tampa Pre-Owned Inventory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { font-family: 'Inter', system_ui, sans-serif; }
    .heading { font-family: 'Space Grotesk', 'Inter', sans-serif; font-weight: 600; letter-spacing: -0.03em; }
    .vehicle-card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    .vehicle-card:hover { transform: translateY(-4px); }
  </style>
</head>
<body class="bg-zinc-950 text-white">

  <!-- Header -->
  <header class="border-b border-zinc-800 bg-zinc-950 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">
      <div class="flex items-center gap-x-3">
        <div class="w-9 h-9 bg-red-600 rounded-2xl flex items-center justify-center">
          <span class="text-white font-bold text-2xl tracking-tighter">S</span>
        </div>
        <div>
          <div class="font-semibold text-2xl tracking-tighter">Skipster</div>
          <div class="text-[10px] text-zinc-400 -mt-1">TAMPA</div>
        </div>
      </div>
      <a href="sms:8139938391" class="hidden md:flex items-center gap-x-2 px-5 py-2.5 rounded-2xl bg-white text-zinc-950 font-semibold text-sm">
        <i class="fa-solid fa-comment-dots"></i>
        <span>Text Us</span>
      </a>
    </div>
  </header>

  <!-- Hero -->
  <div class="relative max-w-7xl mx-auto px-6 pt-10 pb-14">
    <div class="absolute inset-0 bg-cover bg-center rounded-3xl overflow-hidden" 
         style="background-image: url('tampa-pirate-hero.jpg');">
      <div class="absolute inset-0 bg-black/60 rounded-3xl"></div>
    </div>
    <div class="relative max-w-2xl pt-8 pb-6">
      <div class="uppercase tracking-[3px] text-red-400 text-xs font-semibold mb-2">PRE-OWNED INVENTORY • TAMPA BAY</div>
      <h1 class="heading text-6xl tracking-tighter leading-none text-white">Skip the games.<br>Real local inventory.</h1>
      <p class="mt-4 text-xl text-white/90">Curated pre-owned vehicles from trusted Tampa Bay dealers.<br>Text us for details — we reply fast.</p>
    </div>
  </div>

  <!-- Filter Bar -->
  <div class="max-w-7xl mx-auto px-6">
    <div class="flex flex-col sm:flex-row items-center gap-3">
      <select id="modelFilter" class="bg-zinc-900 border border-zinc-700 text-white rounded-2xl px-4 py-3 text-sm w-full sm:w-52">
        <option value="">All Models</option>
      </select>
      <select id="sortFilter" class="bg-zinc-900 border border-zinc-700 text-white rounded-2xl px-4 py-3 text-sm w-full sm:w-48">
        <option value="newest">Newest First</option>
        <option value="price-low">Price Low → High</option>
        <option value="price-high">Price High → Low</option>
        <option value="mileage-low">Lowest Mileage</option>
      </select>
      <button onclick="window.location.href='sms:8139938391?body=Hi%20Skipster%2C%20show%20me%20your%20best%20deals'"
              class="bg-red-600 hover:bg-red-700 px-8 py-3 rounded-2xl font-semibold text-sm w-full sm:w-auto">
        Text Me the Best Deals
      </button>
    </div>
  </div>

  <!-- Vehicle Grid -->
  <div class="max-w-7xl mx-auto px-6 pt-8 pb-16">
    <div id="vehicleGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
  </div>

  <script>
    let allVehicles = [];

    async function loadVehicles() {
      const res = await fetch('vehicles.json');
      allVehicles = await res.json();
      renderVehicles(allVehicles);
      setupFilters();
    }

    function createVehicleCard(vehicle) {
      return `
        <a href="vdppage.html?vin=${vehicle.vin}" class="block">
          <div class="vehicle-card bg-zinc-900 border border-zinc-800 rounded-3xl overflow-hidden">
            <div class="relative">
              <img src="${vehicle.image}" class="w-full h-56 object-cover" 
                   onerror="this.src='https://via.placeholder.com/600x400?text=No+Image'">
              <div class="absolute top-4 right-4 bg-black/70 text-white text-xs px-3 py-1 rounded-full">
                ${vehicle.mileage.toLocaleString()} miles
              </div>
            </div>
            <div class="p-5">
              <div class="font-semibold text-xl">${vehicle.title}</div>
              <div class="text-zinc-400 text-sm mt-1">Tampa Bay, FL</div>
              <div class="text-3xl font-semibold mt-3 text-red-500">$${vehicle.price.toLocaleString()}</div>
            </div>
          </div>
        </a>
      `;
    }

    function renderVehicles(list) {
      const grid = document.getElementById('vehicleGrid');
      grid.innerHTML = list.map(createVehicleCard).join('');
    }

    function setupFilters() {
      const modelFilter = document.getElementById('modelFilter');
      const sortFilter = document.getElementById('sortFilter');

      // Populate model dropdown
      const models = [...new Set(allVehicles.map(v => v.model))];
      models.forEach(model => {
        const opt = document.createElement('option');
        opt.value = model;
        opt.textContent = model;
        modelFilter.appendChild(opt);
      });

      function filterAndSort() {
        let filtered = [...allVehicles];

        if (modelFilter.value) {
          filtered = filtered.filter(v => v.model === modelFilter.value);
        }

        const sort = sortFilter.value;
        if (sort === 'price-low') filtered.sort((a,b) => a.price - b.price);
        if (sort === 'price-high') filtered.sort((a,b) => b.price - a.price);
        if (sort === 'mileage-low') filtered.sort((a,b) => a.mileage - b.mileage);
        if (sort === 'newest') filtered.sort((a,b) => b.year - a.year);

        renderVehicles(filtered);
      }

      modelFilter.addEventListener('change', filterAndSort);
      sortFilter.addEventListener('change', filterAndSort);
    }

    window.onload = loadVehicles;
  </script>
</body>
</html>
