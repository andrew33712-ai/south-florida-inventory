<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skipster • Tampa Pre-Owned Inventory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap');
    
    body { font-family: 'Inter', system-ui, sans-serif; }
    .heading { font-family: 'Space Grotesk', 'Inter', sans-serif; font-weight: 600; letter-spacing: -0.03em; }
    
    .vehicle-card {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .vehicle-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
    }
  </style>
</head>
<body class="bg-zinc-950 text-white">
  <!-- Header -->
  <header class="border-b border-zinc-800 bg-zinc-950 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">
      <div class="flex items-center gap-x-3">
        <div class="w-9 h-9 bg-red-600 rounded-2xl flex items-center justify-center">
          <span class="text-white font-bold text-2xl tracking-tighter">S</span>
        </div>
        <div>
          <div class="font-semibold text-2xl tracking-tighter">Skipster</div>
          <div class="text-[10px] text-zinc-400 -mt-1">TAMPA</div>
        </div>
      </div>
      
      <div class="flex items-center gap-x-3">
        <a href="sms:8139938391" 
           class="hidden md:flex items-center gap-x-2 px-5 py-2.5 rounded-2xl bg-white text-zinc-950 font-semibold text-sm hover:bg-zinc-100 transition-colors">
          <i class="fa-solid fa-comment-dots"></i>
          <span>Text Us</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Hero -->
  <div class="max-w-7xl mx-auto px-6 pt-10 pb-8">
    <div class="max-w-2xl">
      <div class="uppercase tracking-[3px] text-red-500 text-xs font-semibold mb-2">PRE-OWNED INVENTORY • TAMPA BAY</div>
      <h1 class="heading text-6xl tracking-tighter leading-none">Skip the games.<br>Real local inventory.</h1>
      <p class="mt-4 text-xl text-zinc-400">Curated pre-owned vehicles from trusted Tampa Bay dealers. Text us for details or to schedule a viewing — we reply fast.</p>
    </div>

    <!-- Filter Bar -->
    <div class="mt-8 flex flex-col sm:flex-row gap-3">
      <select id="modelFilter" class="bg-zinc-900 border border-zinc-700 text-white rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-red-600 w-full sm:w-64">
        <option value="">All Models</option>
        <option value="Corvette">Corvette</option>
        <option value="Encore">Encore GX</option>
        <option value="Yukon">Yukon / Suburban</option>
        <option value="Defender">Defender / Land Rover</option>
        <option value="Mercedes">Mercedes</option>
        <option value="Maserati">Maserati</option>
      </select>

      <select id="sortFilter" class="bg-zinc-900 border border-zinc-700 text-white rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-red-600 w-full sm:w-52">
        <option value="newest">Newest First</option>
        <option value="price-low">Price: Low to High</option>
        <option value="price-high">Price: High to Low</option>
        <option value="mileage-low">Lowest Mileage</option>
      </select>

      <button onclick="window.location.href='sms:8139938391?body=Hi%20Skipster%2C%20show%20me%20your%20best%20deals%20right%20now'"
              class="flex items-center justify-center gap-x-2 bg-red-600 hover:bg-red-700 transition-colors px-8 py-3 rounded-2xl font-semibold text-sm whitespace-nowrap">
        <i class="fa-solid fa-comment-dots"></i>
        <span>Text Me the Best Deals</span>
      </button>
    </div>
  </div>

  <!-- Vehicle Grid -->
  <div class="max-w-7xl mx-auto px-6 pb-16">
    <div id="vehicleGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      <!-- Vehicles injected by JavaScript -->
    </div>
  </div>

  <footer class="border-t border-zinc-800 py-8 text-center text-xs text-zinc-500">
    Skipster • Tampa Bay • Text <span class="font-medium text-zinc-400">813-993-8391</span> anytime
  </footer>

  <script>
    function initializeTailwind() {
      // Ready for future Tailwind config
    }

    const vehicles = [
      {
        vin: "KL4MMCSL7PB160450",
        title: "2023 Buick Encore GX Preferred",
        price: 20237,
        mileage: 9492,
        image: "KL4MMCSL7PB160450.jpg",
        year: 2023,
        make: "Buick",
        model: "Encore GX"
      },
      {
        vin: "1G1YA2D43N5111637",
        title: "2022 Chevrolet Corvette Stingray 1LT",
        price: 64911,
        mileage: 5714,
        image: "1G1YA2D43N5111637.jpg",
        year: 2022,
        make: "Chevrolet",
        model: "Corvette"
      },
      {
        vin: "1GKS2JKL8PR457682",
        title: "2023 GMC Yukon XL Denali",
        price: 61674,
        mileage: 23944,
        image: "1GKS2JKL8PR457682.jpg",
        year: 2023,
        make: "GMC",
        model: "Yukon XL"
      },
      {
        vin: "SALE2FEU1P2186914",
        title: "2023 Land Rover Defender 130 X-Dynamic SE",
        price: 59802,
        mileage: 30723,
        image: "SALE2FEU1P2186914.jpg",
        year: 2023,
        make: "Land Rover",
        model: "Defender"
      },
      {
        vin: "1G1Y43D98K5800352",
        title: "2019 Chevrolet Corvette ZR1",
        price: 159953,
        mileage: 18114,
        image: "1G1Y43D98K5800352.jpg",
        year: 2019,
        make: "Chevrolet",
        model: "Corvette ZR1"
      },
      {
        vin: "W1KVK8AB8NF009635",
        title: "2022 Mercedes-Benz SL 55 AMG",
        price: 83962,
        mileage: 9329,
        image: "W1KVK8AB8NF009635.jpg",
        year: 2022,
        make: "Mercedes-Benz",
        model: "SL-Class"
      }
    ];

    function createVehicleCard(vehicle) {
      const formattedPrice = vehicle.price.toLocaleString();
      const smsBody = encodeURIComponent(`Hi Skipster, I'm interested in the ${vehicle.title} (${vehicle.vin})`);
      
      return `
        <div class="vehicle-card bg-zinc-900 border border-zinc-800 rounded-3xl overflow-hidden group">
          <div class="relative">
            <img src="${vehicle.image}" 
                 alt="${vehicle.title}"
                 class="w-full h-56 object-cover group-hover:scale-[1.03] transition-transform duration-300"
                 onerror="this.src='https://via.placeholder.com/600x400?text=Photo+Coming+Soon'">
            
            <div class="absolute top-4 right-4 bg-black/70 text-white text-xs px-3 py-1 rounded-full font-medium">
              ${vehicle.mileage.toLocaleString()} miles
            </div>
          </div>
          
          <div class="p-5">
            <div class="flex justify-between items-start gap-4">
              <div class="min-w-0">
                <div class="font-semibold text-xl tracking-tight leading-tight">${vehicle.title}</div>
                <div class="text-zinc-400 text-sm mt-1">Tampa Bay, FL</div>
              </div>
              <div class="text-right flex-shrink-0">
                <div class="text-3xl font-semibold tracking-tighter">$${formattedPrice}</div>
              </div>
            </div>
            
            <div class="mt-5">
              <a href="sms:8139938391?body=${smsBody}" 
                 class="flex items-center justify-center gap-x-2 w-full bg-white hover:bg-zinc-100 active:bg-zinc-200 transition-colors text-zinc-950 font-semibold py-3.5 rounded-2xl text-sm">
                <i class="fa-solid fa-comment-dots"></i>
                <span>Text for Details</span>
              </a>
            </div>
          </div>
        </div>
      `;
    }

    function renderVehicles(filteredVehicles) {
      const grid = document.getElementById('vehicleGrid');
      grid.innerHTML = filteredVehicles.map(createVehicleCard).join('');
    }

    function setupFilters() {
      const modelFilter = document.getElementById('modelFilter');
      const sortFilter = document.getElementById('sortFilter');

      function applyFilters() {
        let filtered = [...vehicles];

        const modelValue = modelFilter.value;
        if (modelValue) {
          filtered = filtered.filter(v => v.model.toLowerCase().includes(modelValue.toLowerCase()));
        }

        const sortValue = sortFilter.value;
        if (sortValue === 'price-low') filtered.sort((a, b) => a.price - b.price);
        else if (sortValue === 'price-high') filtered.sort((a, b) => b.price - a.price);
        else if (sortValue === 'mileage-low') filtered.sort((a, b) => a.mileage - b.mileage);
        else if (sortValue === 'newest') filtered.sort((a, b) => b.year - a.year);

        renderVehicles(filtered);
      }

      modelFilter.addEventListener('change', applyFilters);
      sortFilter.addEventListener('change', applyFilters);
    }

    function init() {
      initializeTailwind();
      renderVehicles(vehicles);
      setupFilters();
      console.log('%c[Skipster] Tampa version loaded', 'color:#666');
    }

    window.onload = init;
  </script>
</body>
</html>
